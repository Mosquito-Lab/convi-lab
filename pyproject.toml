[project]
name = "convi-lab"
version = "0.1.1"
description = "Normalize messy date and time strings into one format, with fuzzy name matching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mosquito Lab (Cyber-Smoke)", email = "mosquitolab2024@protonmail.com" },
]
requires-python = ">=3.10"
keywords = ["datetime", "date-parsing", "normalization", "conversion", "fuzzy-matching", "rapidfuzz"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "logger-lab>=0.2.0,<0.3",
    "rapidfuzz>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Mosquito-Lab/convi-lab"
Repository = "https://github.com/Mosquito-Lab/convi-lab"
Issues = "https://github.com/Mosquito-Lab/convi-lab/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
